<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F6F5FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111017" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="UcuzGez">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>{% block title %}UcuzGez{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* UcuzGez "Pastel" teması.
     Apple düzeni: sistem yazı tipi, buzlu gezinme, gruplu kartlar, segment denetimleri.
     Renk: lavanta ana renk + altı pastel (lavanta, nane, şeftali, gök, tereyağı, gül).
     Ölçüler Fibonacci (8·13·21·34·55·89), yerleşim altın oran. */
  :root {
    --bg: #F6F5FB; --bg-2: #EFEDF7; --card: #FFFFFF; --elev: #FFFFFF;
    --fill: rgba(118, 114, 150, .09); --fill-2: rgba(118, 114, 150, .15);
    --sep: rgba(60, 56, 92, .10); --sep-strong: rgba(60, 56, 92, .18);
    --text: #1C1A29; --sub: #5F5C72; --muted: #9B98AC;
    --brand: #6A60D8; --brand-hover: #5B51C9; --brand-soft: #ECEAFE; --brand-ink: #4A40B2; --brand-ring: rgba(106, 96, 216, .22);
    --lav: #ECE9FF;   --lav-ink: #4D43B3;
    --mint: #DCF3E8;  --mint-ink: #1E6A50;
    --peach: #FFE7DA; --peach-ink: #9A4A24;
    --sky: #DDEEFF;   --sky-ink: #2A5E97;
    --butter: #FFF3C8; --butter-ink: #7A5D00;
    --rose: #FFE3EC;  --rose-ink: #9A3758;
    --r-card: 21px; --r-ctl: 13px; --r-pill: 999px;
    --s1: 8px; --s2: 13px; --s3: 21px; --s4: 34px; --s5: 55px; --s6: 89px;
    --t-xs: 12px; --t-sm: 14px; --t-md: 16px; --t-lg: 20px; --t-xl: 26px; --t-2xl: 34px;
    --shadow: 0 1px 1px rgba(28, 26, 41, .03), 0 8px 24px -12px rgba(52, 44, 110, .14);
    --shadow-lift: 0 2px 4px rgba(28, 26, 41, .04), 0 18px 40px -18px rgba(52, 44, 110, .28);
    --bar: rgba(246, 245, 251, .72);
    --ease: cubic-bezier(.22, 1, .36, 1);
    --spring: cubic-bezier(.34, 1.4, .64, 1);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Inter, system-ui, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111017; --bg-2: #16151E; --card: #1C1B25; --elev: #24232F;
      --fill: rgba(220, 218, 255, .07); --fill-2: rgba(220, 218, 255, .12);
      --sep: rgba(255, 255, 255, .08); --sep-strong: rgba(255, 255, 255, .15);
      --text: #F3F2F9; --sub: #B5B2C6; --muted: #7C798F;
      --brand: #9C94FF; --brand-hover: #B0AAFF; --brand-soft: rgba(156, 148, 255, .16); --brand-ink: #C9C4FF; --brand-ring: rgba(156, 148, 255, .30);
      --lav: rgba(156, 148, 255, .16);  --lav-ink: #CBC6FF;
      --mint: rgba(110, 214, 168, .14); --mint-ink: #9BE3C2;
      --peach: rgba(255, 166, 122, .14); --peach-ink: #FFC2A3;
      --sky: rgba(120, 180, 255, .14);  --sky-ink: #A9CFFF;
      --butter: rgba(255, 214, 102, .13); --butter-ink: #FFDF8A;
      --rose: rgba(255, 140, 180, .14); --rose-ink: #FFB3CD;
      --shadow: 0 0 0 1px rgba(255, 255, 255, .04);
      --shadow-lift: 0 0 0 1px rgba(255, 255, 255, .07), 0 18px 40px -18px rgba(0, 0, 0, .7);
      --bar: rgba(17, 16, 23, .72);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; background: var(--bg); }
  body { margin: 0; color: var(--text); font: 400 var(--t-md)/1.55 var(--font); letter-spacing: -0.006em;
         -webkit-font-smoothing: antialiased; min-height: 100vh; min-height: 100dvh; background:
         radial-gradient(720px 420px at 0% -8%, color-mix(in srgb, var(--lav) 85%, transparent), transparent 70%),
         radial-gradient(640px 380px at 100% -4%, color-mix(in srgb, var(--peach) 70%, transparent), transparent 70%),
         radial-gradient(560px 360px at 50% 110%, color-mix(in srgb, var(--mint) 60%, transparent), transparent 70%),
         var(--bg) fixed; }
  ::selection { background: var(--brand-soft); color: var(--text); }
  a { color: var(--brand); text-underline-offset: 3px; text-decoration-thickness: 1px; }
  a:hover { color: var(--brand-hover); }
  :focus-visible { outline: 3px solid var(--brand-ring); outline-offset: 2px; border-radius: 8px; }
  h1, h2, h3 { margin: 0; letter-spacing: -0.025em; font-weight: 700; line-height: 1.18; }
  p { margin: 0; }
  .num { font-variant-numeric: tabular-nums; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .sub { color: var(--sub); }
  .muted { color: var(--muted); }
  .xs { font-size: var(--t-xs); }
  .sm { font-size: var(--t-sm); }
  .ic { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* üst çubuk: buzlu cam, 1fr | orta | 1fr simetrik */
  .top-wrap { position: sticky; top: 0; z-index: 40; background: var(--bar);
              -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
              border-bottom: .5px solid var(--sep); }
  .top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--s3);
         max-width: 1180px; margin: 0 auto; padding: 10px var(--s3); padding-top: max(10px, env(safe-area-inset-top)); }
  .brand { justify-self: start; display: inline-flex; align-items: center; gap: 10px; font-weight: 700;
           font-size: 18px; letter-spacing: -0.03em; color: var(--text); text-decoration: none; }
  .brand:hover { color: var(--text); }
  .brand-mark { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: #4A40B2;
                background: linear-gradient(135deg, #DCD7FF 0%, #FFD9C7 100%); box-shadow: inset 0 0 0 .5px rgba(0,0,0,.06); }
  .who { justify-self: end; display: flex; align-items: center; gap: var(--s2); font-size: var(--t-sm); color: var(--sub); }
  .avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700;
            background: var(--mint); color: var(--mint-ink); }
  .who a { color: var(--sub); text-decoration: none; }
  .who a:hover { color: var(--text); }

  /* segment denetimi */
  .seg { position: relative; display: inline-flex; align-items: center; gap: 2px; padding: 2px; border-radius: 10px; background: var(--fill); }
  .seg > a, .seg > button, .seg > label { position: relative; border: 0; background: transparent; font: inherit; font-weight: 500; font-size: 13.5px;
         color: var(--text); padding: 5px 14px; border-radius: 8px; cursor: pointer; text-decoration: none; white-space: nowrap;
         display: inline-flex; align-items: center; gap: 6px; transition: background-color .25s var(--ease), box-shadow .25s var(--ease); }
  .seg > a:hover, .seg > button:hover { color: var(--text); background: var(--fill); }
  .seg > [aria-current="page"], .seg > [aria-pressed="true"], .seg > label:has(input:checked) {
         background: var(--elev); font-weight: 600; box-shadow: 0 3px 8px rgba(0,0,0,.08), 0 .5px 1px rgba(0,0,0,.08); }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }

  .card { background: var(--card); border-radius: var(--r-card); box-shadow: var(--shadow); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s1); min-height: 46px;
         padding: 0 var(--s3); border: 0; border-radius: var(--r-ctl); background: var(--brand); color: #fff;
         font-family: inherit; font-weight: 600; font-size: var(--t-md); letter-spacing: -0.01em; line-height: 1; cursor: pointer; text-decoration: none;
         transition: transform .3s var(--spring), background-color .2s ease, opacity .2s ease; }
  @media (prefers-color-scheme: dark) { .btn { color: #15132A; } }
  .btn:hover:not(:disabled) { background: var(--brand-hover); color: #fff; }
  @media (prefers-color-scheme: dark) { .btn:hover:not(:disabled) { color: #15132A; } }
  .btn:active:not(:disabled) { transform: scale(.96); }
  .btn:disabled { opacity: .7; cursor: progress; }
  .btn-block { width: 100%; }
  .btn-tint { background: var(--brand-soft); color: var(--brand-ink); }
  .btn-tint:hover:not(:disabled) { background: var(--fill-2); color: var(--brand-ink); }
  .btn-plain { background: var(--fill); color: var(--text); }
  .btn-plain:hover:not(:disabled) { background: var(--fill-2); color: var(--text); }
  .btn-sm { min-height: 32px; padding: 0 var(--s2); font-size: var(--t-sm); border-radius: 10px; }
  .btn-danger { background: var(--rose); color: var(--rose-ink); }
  .btn-danger:hover:not(:disabled) { background: var(--rose); color: var(--rose-ink); filter: brightness(.97); }

  .field { display: grid; gap: 6px; }
  .label { font-size: 13px; font-weight: 500; color: var(--sub); padding-left: 2px; }
  .input { width: 100%; min-width: 0; min-height: 44px; padding: 10px var(--s2); border: 0; border-radius: var(--r-ctl);
           background: var(--fill); color: var(--text); font: inherit; transition: box-shadow .25s var(--ease), background-color .25s ease; }
  .input::placeholder { color: var(--muted); }
  .input:hover { background: var(--fill-2); }
  .input:focus { outline: none; background: var(--card); box-shadow: 0 0 0 1px var(--brand), 0 0 0 5px var(--brand-ring); }
  input[type=date].input { -webkit-appearance: none; appearance: none; }
  .check { display: flex; align-items: center; gap: var(--s1); min-height: 34px; cursor: pointer; font-size: var(--t-sm); }
  .check input { width: 18px; height: 18px; accent-color: var(--brand); margin: 0; }

  /* Apple tarzı anahtar */
  .switch { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); min-height: 44px; cursor: pointer; font-size: var(--t-sm); }
  .switch input { -webkit-appearance: none; appearance: none; flex: none; position: relative; width: 46px; height: 28px; margin: 0;
                  border-radius: 999px; background: var(--fill-2); cursor: pointer; transition: background-color .25s ease; }
  .switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 50%; background: #fff;
                         box-shadow: 0 2px 6px rgba(0,0,0,.18), 0 0 0 .5px rgba(0,0,0,.04); transition: transform .3s var(--spring); }
  .switch input:checked { background: var(--mint-ink); }
  @media (prefers-color-scheme: dark) { .switch input:checked { background: #4CC08E; } }
  .switch input:checked::after { transform: translateX(18px); }

  .notice { display: flex; gap: 10px; align-items: flex-start; padding: var(--s2) var(--s3); border-radius: var(--r-ctl);
            background: var(--sky); color: var(--sky-ink); font-size: var(--t-sm); }
  .notice-error { background: var(--peach); color: var(--peach-ink); }
  .notice-ok { background: var(--mint); color: var(--mint-ink); }
  .notice .ic { margin-top: 1px; }
  .spinner { width: 15px; height: 15px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes enter { from { opacity: 0; transform: translateY(10px) scale(.99); } to { opacity: 1; transform: none; } }

  /* bildirim baloncuğu */
  .toast { position: fixed; left: 50%; bottom: calc(var(--s4) + env(safe-area-inset-bottom)); z-index: 60; transform: translate(-50%, 20px);
           padding: 11px 18px; border-radius: 999px; background: color-mix(in srgb, var(--text) 88%, transparent); color: var(--bg);
           font-size: var(--t-sm); font-weight: 600; opacity: 0; pointer-events: none;
           -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); transition: opacity .25s ease, transform .4s var(--spring); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  main { max-width: 1180px; margin: 0 auto; padding: var(--s3) var(--s3) var(--s6); }

  /* telefonda alt sekme çubuğu */
  .tabbar { display: none; }
  @media (max-width: 720px) {
    .top { grid-template-columns: 1fr auto; padding: 8px var(--s2); padding-top: max(8px, env(safe-area-inset-top)); }
    .top .seg { display: none; }
    .who .name { display: none; }
    main { padding: var(--s2) var(--s2) calc(var(--s6) + 34px + env(safe-area-inset-bottom)); }
    .tabbar { display: grid; grid-template-columns: repeat(3, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
              padding: 6px var(--s2) max(6px, env(safe-area-inset-bottom)); background: var(--bar); border-top: .5px solid var(--sep);
              -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); }
    .tabbar a { display: grid; justify-items: center; gap: 2px; padding: 4px 0; font-size: 10.5px; font-weight: 500; color: var(--muted); text-decoration: none; }
    .tabbar a[aria-current="page"] { color: var(--brand); }
    .tabbar .ic { width: 24px; height: 24px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  {% block style %}{% endblock %}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-plane" viewBox="0 0 24 24"><path transform="rotate(45 12 12)" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3.5M8 7.5l4-4 4 4"/><path d="M7 11H6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-1"/></symbol>
  <symbol id="i-bus" viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="15" rx="3"/><path d="M5 11h14M8 21v-2.5M16 21v-2.5"/><circle cx="8.5" cy="15" r=".6"/><circle cx="15.5" cy="15" r=".6"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></symbol>
  <symbol id="i-loc" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></symbol>
</svg>

<div class="top-wrap">
<header class="top">
  <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"><svg class="ic" style="width:16px;height:16px;stroke-width:2.2"><use href="#i-plane"/></svg></span>UcuzGez</a>
  {% if user %}
  <nav class="seg" aria-label="Bölümler">
    <a href="/" {% if page == 'ara' %}aria-current="page"{% endif %}>Ara</a>
    <a href="/takipler" {% if page == 'takip' %}aria-current="page"{% endif %}>Takiplerim</a>
    <a href="/ayarlar" {% if page == 'ayar' %}aria-current="page"{% endif %}>Ayarlar</a>
  </nav>
  <div class="who"><span class="name">{{ user.name }}</span><a href="/ayarlar" class="avatar" aria-label="Hesabım">{{ (user.name or '?')[:1]|upper }}</a></div>
  {% else %}<span></span><span></span>{% endif %}
</header>
</div>
<main>{% block body %}{% endblock %}</main>
{% if user %}
<nav class="tabbar" aria-label="Bölümler">
  <a href="/" {% if page == 'ara' %}aria-current="page"{% endif %}><svg class="ic"><use href="#i-search"/></svg>Ara</a>
  <a href="/takipler" {% if page == 'takip' %}aria-current="page"{% endif %}><svg class="ic"><use href="#i-bell"/></svg>Takipler</a>
  <a href="/ayarlar" {% if page == 'ayar' %}aria-current="page"{% endif %}><svg class="ic"><use href="#i-gear"/></svg>Ayarlar</a>
</nav>
{% endif %}
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
window.toast = function (msg) {
  var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__tt); window.__tt = setTimeout(function () { t.classList.remove('show'); }, 2200);
};
</script>
{% block script %}{% endblock %}
</body>
</html>
