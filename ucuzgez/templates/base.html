<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UcuzGez</title>
<style>
  :root { --bg:#f6f5f1; --card:#fff; --ink:#1d1d1b; --mute:#6b6a65; --line:#e4e2db; --acc:#0f6b5c; --warn:#a14d00; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; background:var(--card); }
  header b { font-size:18px; letter-spacing:-.2px; } header a { color:var(--mute); }
  main { max-width:980px; margin:0 auto; padding:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; }
  h2 { font-size:16px; margin:0 0 12px; }
  label { display:block; font-size:12px; color:var(--mute); margin-bottom:3px; }
  input[type=text],input[type=date],input[type=number] { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font:inherit; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; }
  .row { display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin-top:12px; }
  .row label { display:inline; color:var(--ink); font-size:14px; }
  button,.btn { background:var(--acc); color:#fff; border:0; border-radius:8px; padding:9px 16px; font:inherit; cursor:pointer; text-decoration:none; display:inline-block; }
  button.ghost { background:transparent; color:var(--acc); border:1px solid var(--acc); }
  button.small { padding:4px 10px; font-size:13px; }
  .mute { color:var(--mute); font-size:13px; }
  .trip { border-top:1px solid var(--line); padding:14px 0; }
  .trip:first-child { border-top:0; }
  .trip .head { display:flex; justify-content:space-between; gap:10px; font-weight:600; }
  .price { font-size:18px; color:var(--acc); white-space:nowrap; }
  .leg { margin:4px 0; } .leg a { margin-right:8px; }
  .save { color:var(--acc); font-weight:600; }
  .tag { font-size:11px; padding:1px 6px; border-radius:4px; background:#e6f2ef; color:var(--acc); margin-left:6px; font-weight:500; }
  .err { color:var(--warn); }
  table { width:100%; border-collapse:collapse; } td,th { text-align:left; padding:6px 4px; border-top:1px solid var(--line); font-size:14px; }
</style>
</head>
<body>
<header><b>✈️ UcuzGez</b>{% if user %}<span class="mute">{{ user.name }} · <a href="/cikis">çıkış</a></span>{% endif %}</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
