<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}UcuzGez{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EEF2F0; --surface: #FFFFFF; --ink: #16252A; --mute: #56666A; --line: #CFD8D5;
    --accent: #0B6A4D; --accent-strong: #08553D; --soft: #DDEBE4; --warn: #9A3B1E; --warn-soft: #F6E6E0;
    --r-sm: 6px; --r-md: 12px;
    --step--1: 0.875rem; --step-0: 1rem; --step-1: 1.25rem; --step-2: 1.6rem; --step-3: 2.1rem;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 400 var(--step-0)/1.55 "Schibsted Grotesk", system-ui, sans-serif; }
  a { color: var(--accent-strong); text-underline-offset: 3px; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .top { display: flex; align-items: center; gap: 28px; padding: 18px clamp(16px, 4vw, 40px);
         border-bottom: 1px solid var(--line); }
  .brand { font-weight: 800; font-size: var(--step-1); letter-spacing: -0.02em; color: var(--ink); text-decoration: none; }
  .nav { display: flex; gap: 4px; flex: 1; }
  .nav a { padding: 6px 12px; border-radius: var(--r-sm); color: var(--mute); text-decoration: none; font-weight: 500; }
  .nav a:hover { color: var(--ink); background: var(--surface); }
  .nav a[aria-current="page"] { color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
  .who { color: var(--mute); font-size: var(--step--1); white-space: nowrap; }
  .who a { color: var(--mute); }

  main { max-width: 920px; margin: 0 auto; padding: clamp(20px, 4vw, 44px) clamp(16px, 4vw, 40px) 80px; }
  h1 { font-size: var(--step-3); line-height: 1.15; letter-spacing: -0.025em; font-weight: 800; margin: 0 0 12px; }
  h2 { font-size: var(--step-1); letter-spacing: -0.01em; margin: 0 0 12px; }
  p { margin: 0 0 12px; }
  .lede { color: var(--mute); max-width: 60ch; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px;
         padding: 0 20px; border: 0; border-radius: var(--r-sm); background: var(--accent); color: #fff;
         font: 700 var(--step-0)/1 inherit; cursor: pointer; text-decoration: none; }
  .btn:hover { background: var(--accent-strong); }
  .btn[disabled] { opacity: .7; cursor: progress; }
  .btn-quiet { background: transparent; color: var(--accent-strong); box-shadow: inset 0 0 0 1.5px var(--accent); }
  .btn-quiet:hover { background: var(--soft); }
  .btn-small { min-height: 34px; padding: 0 12px; font-size: var(--step--1); }

  .field label, .field-label { display: block; font-size: var(--step--1); font-weight: 500; color: var(--mute); margin-bottom: 4px; }
  .input { width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r-sm);
           background: var(--surface); color: var(--ink); font: inherit; }
  .input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--soft); }
  .check { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); }

  .notice { padding: 12px 16px; border-radius: var(--r-sm); background: var(--soft); margin-bottom: 20px; }
  .notice-error { background: var(--warn-soft); color: var(--warn); }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: clamp(16px, 3vw, 28px); }
  .muted { color: var(--mute); }
  .small { font-size: var(--step--1); }

  @media (max-width: 640px) {
    .top { flex-wrap: wrap; gap: 8px 16px; }
    .nav { order: 3; flex-basis: 100%; margin: 0 -12px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  {% block style %}{% endblock %}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/">UcuzGez</a>
  {% if user %}
  <nav class="nav" aria-label="Bölümler">
    <a href="/" {% if page == 'ara' %}aria-current="page"{% endif %}>Ara</a>
    <a href="/takipler" {% if page == 'takip' %}aria-current="page"{% endif %}>Takiplerim</a>
    <a href="/ayarlar" {% if page == 'ayar' %}aria-current="page"{% endif %}>Ayarlar</a>
  </nav>
  <span class="who">{{ user.name }}, <a href="/cikis">çıkış yap</a></span>
  {% endif %}
</header>
<main>{% block body %}{% endblock %}</main>
{% block script %}{% endblock %}
</body>
</html>
