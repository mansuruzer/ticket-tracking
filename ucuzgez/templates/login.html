{% extends "base.html" %}
{% block body %}
<div class="card" style="max-width:420px;margin:40px auto">
  <h2>Giriş</h2>
  <p class="mute">Yöneticinin verdiği kişisel giriş linkini aç ya da kodu buraya yapıştır.</p>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post" action="/giris">
    <input type="text" name="token" placeholder="giriş kodu" autofocus>
    <div class="row"><button>Giriş</button></div>
  </form>
</div>
{% endblock %}
