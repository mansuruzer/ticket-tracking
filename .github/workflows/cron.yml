# Vercel Hobby'de cron günde 1 kez çalışır; takipleri 3 saatte bir kontrol etmek için
# GitHub Actions /cron adresini tetikler (ücretsiz). Repo Settings > Secrets > Actions:
#   APP_URL      = https://PROJE.vercel.app
#   CRON_SECRET  = Vercel'deki CRON_SECRET ile aynı
name: zamanlayici
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: /cron çağır
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL/CRON_SECRET ayarlı değil, atlanıyor"; exit 0; fi
          curl -fsS --max-time 320 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/cron"
